<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨 — WebGL2 サンプル (水面 / 紙)</title>
</head>
<body>
<canvas id="gl" aria-label="墨のキャンバス。なぞると墨が乗ります"></canvas>
<div class="ui">
  <p data-mode="fluid">筆(ペン)で墨が乗る。指は水面を揺らす。マウスは押しながら。<br>ひと呼吸とどまると、墨が溜まる。</p>
  <p data-mode="paper" hidden>紙モードは組み立て中。いまは紙だけ。<br>「紙を替える」で目の違う紙になる。</p>
  <div class="actions">
    <div class="modes" role="group" aria-label="モード">
      <button type="button" data-mode="fluid" aria-pressed="true">水面</button>
      <button type="button" data-mode="paper" aria-pressed="false">紙</button>
    </div>
    <button id="clear" type="button">紙を替える</button>
  </div>
</div>
<div id="fallback">この端末のブラウザは WebGL2 の浮動小数テクスチャに対応していないため、<br>墨を表示できません。</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
