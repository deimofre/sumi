<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>regress (paper)</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; } #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }</style>
<script>
// 乱数を固定する (mulberry32)。モジュールが読まれる前に差し替える
(function () {
  let a = 0x9e3779b9;
  Math.random = function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
})();
</script>
</head>
<body>
<canvas id="gl"></canvas>
<pre id="out"></pre>
<script type="module" src="./harness-paper.ts"></script>
</body>
</html>
